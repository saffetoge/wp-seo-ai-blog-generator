name: Auto Release on Push

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get plugin version from file
        id: version
        run: |
          VERSION=$(grep -oP "Version:\s*\K[0-9.]+" wp-product-blog-generator.php)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          echo "Plugin version: $VERSION"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view ${{ steps.version.outputs.VERSION }} > /dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing release if exists
        if: steps.check_release.outputs.EXISTS == 'true'
        run: |
          gh release delete ${{ steps.version.outputs.VERSION }} --yes
          git push origin --delete ${{ steps.version.outputs.VERSION }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create plugin ZIP
        run: |
          mkdir -p build/wp-product-blog-generator
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/wp-product-blog-generator/
          cd build
          zip -r wp-product-blog-generator.zip wp-product-blog-generator

      - name: Create Release with ZIP
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Version ${{ steps.version.outputs.VERSION }}
          body: |
            Otomatik release - ${{ steps.version.outputs.VERSION }}
          files: build/wp-product-blog-generator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
