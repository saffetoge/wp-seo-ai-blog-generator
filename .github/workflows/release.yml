name: Release Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version
        id: version
        run: |
          version="$(awk -F': ' '/^ *Version:/ {print $2; exit}' wp-product-blog-generator.php)"
          if [ -z "$version" ]; then
            echo "Version not found in plugin header."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Tag exists: ${tag}`);
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Tag created: ${tag} -> ${context.sha}`);
            }

      - name: Build plugin zip
        run: |
          git archive --format=zip --prefix=wp-product-blog-generator/ "${GITHUB_SHA}" -o wp-product-blog-generator.zip

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          artifacts: wp-product-blog-generator.zip
          allowUpdates: true
          replacesArtifacts: true
