name: Release Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 "Version:" wp-product-blog-generator.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "Found version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "Version not found!"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: |
          mkdir -p dist/wp-product-blog-generator
          cp -r assets includes languages *.php dist/wp-product-blog-generator/ 2>/dev/null || true
          cp -r dist/wp-product-blog-generator/*.php dist/wp-product-blog-generator/ 2>/dev/null || true
          cd dist && zip -r wp-product-blog-generator.zip wp-product-blog-generator
          ls -la

      - name: Delete old release
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/wp-product-blog-generator.zip \
            --title "Version ${{ steps.version.outputs.version }}" \
            --notes "Release v${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases (keep last 5)
        run: |
          echo "Fetching releases..."
          releases=$(gh release list --limit 100 --json tagName -q '.[].tagName')
          count=0
          for tag in $releases; do
            count=$((count + 1))
            if [ $count -gt 5 ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes || true
              git push origin --delete "$tag" 2>/dev/null || true
            fi
          done
          echo "Cleanup complete. Kept last 5 releases."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
