name: Release Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([0-9.]+).*/\\1/p' wp-product-blog-generator.php | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Version not found in plugin header."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: |
          mkdir -p dist/wp-product-blog-generator
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "dist/" \
            ./ dist/wp-product-blog-generator/
          (cd dist && zip -r wp-product-blog-generator.zip wp-product-blog-generator)

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          artifacts: dist/wp-product-blog-generator.zip
          allowUpdates: true
          replacesArtifacts: true
