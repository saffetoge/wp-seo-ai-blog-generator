name: Release Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from plugin file
        id: version
        run: |
          VERSION=$(grep -oP 'Version:\s*\K[0-9.]+' wp-product-blog-generator.php | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Create plugin ZIP
        run: |
          mkdir -p wp-product-blog-generator
          cp -r assets includes languages *.php wp-product-blog-generator/ 2>/dev/null || true
          zip -r wp-product-blog-generator.zip wp-product-blog-generator
          ls -la wp-product-blog-generator.zip

      - name: Delete existing release
        run: |
          gh release delete ${{ steps.version.outputs.TAG }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        run: |
          gh release create ${{ steps.version.outputs.TAG }} \
            wp-product-blog-generator.zip \
            --title "Version ${{ steps.version.outputs.VERSION }}" \
            --notes "Release ${{ steps.version.outputs.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
